<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
  <!--
    展墙主构图层（无滤镜，栅格化便宜；颗粒由 wall-grain.svg 平铺层负责）
    层序：底色渐变 → 顶部暖光池 → 右下铜绿 → 暗角
    参考位图归档于 assets-src/backgrounds/museum-wall.png
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3036"/>
      <stop offset="0.45" stop-color="#262c33"/>
      <stop offset="1" stop-color="#171c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#cdba9b" stop-opacity="0.58"/>
      <stop offset="0.32" stop-color="#a99878" stop-opacity="0.26"/>
      <stop offset="0.68" stop-color="#8a8272" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8a8272" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="patina" cx="0.9" cy="0.98" r="0.38">
      <stop offset="0" stop-color="#2e5a52" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2e5a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.48" r="0.85">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1600" fill="url(#base)"/>
  <rect width="900" height="1600" fill="url(#glow)"/>
  <rect width="900" height="1600" fill="url(#patina)"/>

  <rect width="900" height="1600" fill="url(#vign)"/>
</svg>
